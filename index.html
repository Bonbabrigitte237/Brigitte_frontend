<!DOCTYPE html>
<html>
<head>
  <base href="/Brigitte_frontend/">
  <meta charset="UTF-8">
  <title>Novoact</title>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Application Novoact">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    body {
      background-color: #f4f7f9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .btn-apk {
      margin-top: 20px;
      display: inline-block;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn-apk:hover {
      background-color: #0056b3;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 2s linear infinite;
      margin: 15px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <h1 style="color: #2c3e50;">Novoact</h1>
    <div class="loader"></div>
    <p id="status">Chargement de l'application...</p>

    <a href="https://drive.google.com/file/d/12pvhoT828JjmEWqBVE6Ocr-w8Xp9_tt3/view?usp=sharing" target="_blank" class="btn-apk">
      📥 Télécharger l'APK (Android)
    </a>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // On vérifie si le service worker est présent
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('flutter_service_worker.js');
      }
    });
  </script>
  
  <script src="main.dart.js" type="application/javascript"></script>

</body>
</html>
