name: novoact
description: "Plateforme de gestion des actes de naissance - République du Cameroun"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  http: ^1.1.0
  
  # State management
  provider: ^6.1.1
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # UUID generation
  uuid: ^4.2.0
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Image picker
  image_picker: ^1.0.7
  
  # File picker
  file_picker: ^6.1.1
  
  # URL launcher
  url_launcher: ^6.2.6

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_storage: ^11.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
